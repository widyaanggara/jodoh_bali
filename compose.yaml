version: "3.9"

services:
#WEBSITE UTAMA
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs_app
    ports:
      - "3010:3010"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Tambahkan ini agar Next.js tidak mencari-cari hostname container ID
      HOSTNAME: "0.0.0.0"
      PORT: 3010
      NETRA_HISTORY_ENABLED: "${NETRA_HISTORY_ENABLED:-false}"
      NETRA_HISTORY_RULES_PROJECT: "${NETRA_HISTORY_RULES_PROJECT:-}"

  # WEBSITE DEV
  nextjs_dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs_dev
    ports:
      - "3011:3010"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3010
      NETRA_HISTORY_ENABLED: "${NETRA_HISTORY_ENABLED:-false}"
      NETRA_HISTORY_RULES_PROJECT: "${NETRA_HISTORY_RULES_PROJECT:-}"

